<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c25577">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Medicações">
  <link rel="manifest" href="manifest.json">
  <title>Minhas medicações</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --rose: #c25577;
      --rose-d: #a23f61;
      --rose-l: #fdf1f4;
      --rose-m: #f6d6df;
      --ink: #3a2a31;
      --mute: #94838a;
      --line: #f3e4e9;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --hero: linear-gradient(145deg, #d86a8d, #a9405f)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: 'Nunito', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent
    }

    body {
      max-width: 520px;
      margin: 0 auto
    }

    button {
      font-family: inherit;
      cursor: pointer
    }

    :focus-visible {
      outline: 2px solid var(--rose);
      outline-offset: 3px
    }

    .i {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none
    }

    .flor {
      position: absolute;
      color: #fff;
      pointer-events: none
    }

    /* login */
    .login {
      position: fixed;
      inset: 0;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #fff;
      overflow: hidden
    }

    .login-top {
      padding: 12vh 28px 0;
      text-align: center
    }

    .login h1,
    .hero h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      letter-spacing: -.01em;
      margin: 0
    }

    .login h1 {
      font-size: 30px
    }

    .login p {
      color: var(--mute);
      margin: 8px 0 0
    }

    .login-card {
      position: relative;
      margin-top: auto;
      padding: 70px 28px calc(env(safe-area-inset-bottom) + 36px);
      background: var(--hero);
      border-radius: 64px 64px 0 0;
      text-align: center;
      overflow: hidden
    }

    .emblem {
      position: absolute;
      top: -1px;
      left: 50%;
      width: 84px;
      height: 84px;
      margin: -42px 0 0 -42px;
      border-radius: 50%;
      background: #fff;
      color: var(--rose);
      display: grid;
      place-items: center;
      box-shadow: 0 0 0 8px #fff, 0 10px 24px rgba(169, 64, 95, .25);
      animation: flutuar 4s ease-in-out infinite
    }

    .emblem .i {
      width: 36px;
      height: 36px;
      stroke-width: 1.8
    }

    @keyframes flutuar {
      50% {
        transform: translateY(-4px)
      }
    }

    .login input {
      position: relative;
      width: 100%;
      font: 700 26px 'Nunito';
      text-align: center;
      letter-spacing: .4em;
      padding: 14px;
      border: 0;
      border-radius: 18px;
      background: rgba(255, 255, 255, .18);
      color: #fff;
      transition: background .2s, box-shadow .2s
    }

    .login input::placeholder {
      color: rgba(255, 255, 255, .6);
      letter-spacing: .2em
    }

    .login input:focus {
      outline: 0;
      background: rgba(255, 255, 255, .28);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .5)
    }

    .login .msg {
      color: #fff;
      position: relative
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 18px;
      background: #fff;
      color: var(--rose-d);
      font-weight: 700;
      font-size: 16px;
      transition: transform .15s var(--ease), box-shadow .2s
    }

    .btn:active {
      transform: scale(.97)
    }

    /* topo */
    .hero {
      position: relative;
      background: var(--hero);
      color: #fff;
      padding: calc(env(safe-area-inset-top) + 26px) 22px 34px;
      border-radius: 0 0 40px 40px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 14px 30px rgba(169, 64, 95, .2)
    }

    .hero>div {
      position: relative
    }

    .hi {
      margin: 0;
      opacity: .85;
      font-weight: 600
    }

    .hero h1 {
      font-size: 27px;
      line-height: 1.15;
      margin: 2px 0 6px
    }

    .data {
      margin: 0;
      opacity: .85;
      font-size: 14px
    }

    .data::first-letter {
      text-transform: uppercase
    }

    .f1 {
      width: 130px;
      height: 130px;
      right: -34px;
      top: -30px;
      opacity: .14;
      transform: rotate(15deg);
      animation: girar 40s linear infinite
    }

    .f2 {
      width: 70px;
      height: 70px;
      left: 46%;
      bottom: -24px;
      opacity: .12
    }

    @keyframes girar {
      to {
        transform: rotate(375deg)
      }
    }

    .ring {
      position: relative;
      width: 76px;
      height: 76px;
      flex: none
    }

    .ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg)
    }

    .ring circle {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round
    }

    .ring .trk {
      stroke: rgba(255, 255, 255, .25)
    }

    .ring .val {
      stroke: #fff;
      stroke-dasharray: 113.1;
      stroke-dashoffset: 113.1;
      transition: stroke-dashoffset .6s var(--ease)
    }

    .ring b {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 17px;
      font-variant-numeric: tabular-nums
    }

    .ring.full {
      animation: pulso .8s var(--ease)
    }

    @keyframes pulso {
      40% {
        transform: scale(1.12)
      }
    }

    main {
      padding-bottom: 110px
    }

    .wrap {
      padding: 0 18px
    }

    .msg {
      color: var(--rose-d);
      min-height: 20px;
      margin: 12px 22px 0;
      font-size: 14px
    }

    .per {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 4px 10px;
      color: var(--rose-d);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase
    }

    .per::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line)
    }

    .dose,
    details {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      margin-bottom: 10px;
      transition: transform .15s var(--ease), border-color .2s, background .25s, box-shadow .2s;
      animation: subir .45s var(--ease) both;
      animation-delay: var(--d, 0s)
    }

    @keyframes subir {
      from {
        opacity: 0;
        transform: translateY(10px)
      }
    }

    .dose {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      text-align: left;
      padding: 13px 15px 13px 13px;
      color: inherit
    }

    .dose:active {
      transform: scale(.975)
    }

    .tile {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      background: var(--rose-l);
      color: var(--rose);
      display: grid;
      place-items: center;
      flex: none;
      transition: transform .3s var(--ease), background .25s, color .25s
    }

    .t {
      flex: 1;
      min-width: 0
    }

    .t b {
      display: block;
      font-size: 16px
    }

    .t span {
      color: var(--mute);
      font-size: 14px
    }

    .t em {
      font-style: normal;
      color: var(--rose-d);
      font-weight: 700
    }

    .chk {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--rose-m);
      display: grid;
      place-items: center;
      flex: none;
      transition: background .25s, border-color .25s
    }

    .chk svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .chk path {
      stroke-dasharray: 24
    }

    .chk.pop {
      animation: pop .4s var(--ease)
    }

    .chk.pop path {
      animation: draw .35s .05s var(--ease) both
    }

    @keyframes pop {
      0% {
        transform: scale(.6)
      }

      60% {
        transform: scale(1.2)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes draw {
      from {
        stroke-dashoffset: 24
      }

      to {
        stroke-dashoffset: 0
      }
    }

    .dose.done {
      background: var(--rose-l);
      border-color: var(--rose-m)
    }

    .dose.done .chk {
      background: var(--rose);
      border-color: var(--rose)
    }

    .dose.done .tile {
      background: var(--rose);
      color: #fff
    }

    details {
      padding: 0 14px
    }

    details[open] {
      border-color: var(--rose-m);
      box-shadow: 0 8px 20px rgba(194, 85, 119, .1)
    }

    details.off {
      opacity: .6
    }

    summary {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 26px 13px 0;
      cursor: pointer;
      list-style: none
    }

    summary::-webkit-details-marker {
      display: none
    }

    summary::after {
      content: "";
      position: absolute;
      right: 4px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--rose);
      border-bottom: 2px solid var(--rose);
      transform: translateY(-70%) rotate(45deg);
      transition: transform .25s var(--ease)
    }

    details[open] summary::after {
      transform: translateY(-30%) rotate(-135deg)
    }

    .chip {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 10px;
      border-radius: 99px;
      background: var(--rose-l);
      color: var(--rose-d);
      font-size: 12px;
      font-weight: 700
    }

    dl {
      margin: 0 0 14px;
      display: grid;
      grid-template-columns: 105px 1fr;
      gap: 8px 10px;
      font-size: 14px;
      animation: subir .3s var(--ease)
    }

    dt {
      color: var(--mute)
    }

    dd {
      margin: 0
    }

    .empty {
      color: var(--mute);
      text-align: center;
      padding: 36px 12px
    }

    /* navegação */
    .nav {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 14px);
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 488px;
      display: flex;
      gap: 4px;
      padding: 7px;
      background: var(--hero);
      border-radius: 26px;
      box-shadow: 0 14px 30px rgba(169, 64, 95, .38);
      z-index: 5
    }

    .nav button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 0 7px;
      border: 0;
      border-radius: 19px;
      background: none;
      color: rgba(255, 255, 255, .8);
      font-size: 11px;
      font-weight: 700;
      transition: background .25s, color .25s, transform .15s var(--ease)
    }

    .nav button:active {
      transform: scale(.94)
    }

    .nav button.on {
      background: #fff;
      color: var(--rose-d)
    }

    .nav .spin .i {
      animation: rodar .7s var(--ease)
    }

    @keyframes rodar {
      to {
        transform: rotate(360deg)
      }
    }

    [hidden] {
      display: none !important
    }

    @media (hover:hover) {
      .dose:hover {
        border-color: var(--rose-m);
        box-shadow: 0 8px 18px rgba(194, 85, 119, .12);
        transform: translateY(-2px)
      }

      .dose:hover .tile {
        transform: rotate(-6deg) scale(1.06)
      }

      .dose:hover .chk {
        border-color: var(--rose)
      }

      details:hover {
        border-color: var(--rose-m)
      }

      .btn:hover {
        box-shadow: 0 8px 20px rgba(0, 0, 0, .15)
      }

      .nav button:not(.on):hover {
        background: rgba(255, 255, 255, .18);
        color: #fff
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="flor" viewBox="0 0 100 100">
      <g fill="currentColor">
        <circle cx="50" cy="26" r="17" />
        <circle cx="74" cy="44" r="17" />
        <circle cx="65" cy="72" r="17" />
        <circle cx="35" cy="72" r="17" />
        <circle cx="26" cy="44" r="17" />
      </g>
    </symbol>
    <symbol id="i-pill" viewBox="0 0 24 24">
      <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z" />
      <path d="m8.5 8.5 7 7" />
    </symbol>
    <symbol id="i-droplet" viewBox="0 0 24 24">
      <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z" />
    </symbol>
    <symbol id="i-syringe" viewBox="0 0 24 24">
      <path d="m18 2 4 4" />
      <path d="m17 7 3-3" />
      <path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5" />
      <path d="m9 11 4 4" />
      <path d="m5 19-3 3" />
      <path d="m14 4 6 6" />
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2" />
      <path d="M12 20v2" />
      <path d="m4.93 4.93 1.41 1.41" />
      <path d="m17.66 17.66 1.41 1.41" />
      <path d="M2 12h2" />
      <path d="M20 12h2" />
      <path d="m6.34 17.66-1.41 1.41" />
      <path d="m19.07 4.93-1.41 1.41" />
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24">
      <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
      <path d="m9 14 2 2 4-4" />
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
      <path d="M21 3v5h-5" />
      <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
      <path d="M8 16H3v5" />
    </symbol>
    <symbol id="i-out" viewBox="0 0 24 24">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <polyline points="16 17 21 12 16 7" />
      <line x1="21" x2="9" y1="12" y2="12" />
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path d="M5 12h14" />
      <path d="m12 5 7 7-7 7" />
    </symbol>
  </svg>

  <section id="login" class="login" hidden>
    <div class="login-top">
      <h1>Minhas medicações</h1>
      <p>Cuidar de você, um horário de cada vez.</p>
    </div>
    <div class="login-card">
      <svg class="flor" style="width:120px;height:120px;right:-30px;bottom:-30px;opacity:.13">
        <use href="#flor" />
      </svg>
      <div class="emblem"><svg class="i">
          <use href="#i-pill" />
        </svg></div>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"
        aria-label="PIN">
      <div class="msg" id="loginMsg"></div>
      <button class="btn" id="entrar">Entrar <svg class="i">
          <use href="#i-arrow" />
        </svg></button>
    </div>
  </section>

  <main id="app" hidden>
    <header class="hero">
      <svg class="flor f1">
        <use href="#flor" />
      </svg>
      <svg class="flor f2">
        <use href="#flor" />
      </svg>
      <div>
        <p class="hi" id="saudacao">Olá</p>
        <h1 id="titulo">Hoje</h1>
        <p class="data" id="data"></p>
      </div>
      <div class="ring" id="ring">
        <svg viewBox="0 0 44 44">
          <circle class="trk" cx="22" cy="22" r="18" />
          <circle class="val" id="prog" cx="22" cy="22" r="18" />
        </svg>
        <b id="ringTxt">0/0</b>
      </div>
    </header>
    <div class="msg" id="msg"></div>
    <div class="wrap">
      <div id="vHoje">
        <div id="doses"></div>
      </div>
      <div id="vMeds" hidden></div>
    </div>
    <nav class="nav">
      <button id="tHoje" class="on"><svg class="i">
          <use href="#i-list" />
        </svg>Hoje</button>
      <button id="tMeds"><svg class="i">
          <use href="#i-pill" />
        </svg>Remédios</button>
      <button id="atualizar"><svg class="i">
          <use href="#i-refresh" />
        </svg>Atualizar</button>
      <button id="sair"><svg class="i">
          <use href="#i-out" />
        </svg>Sair</button>
    </nav>
  </main>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbygi4DMEklucoLk_H2q8SPpUq-h3Y-r52xIy5zKFYcW95G6CPohunB_8MKD0q7L2Wje/exec'; 
    const $ = s => document.querySelector(s);
    let pin = localStorage.getItem('pin') || '';
    let doses = [];
    const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const ic = n => `<svg class="i"><use href="#i-${n}"/></svg>`;

    async function api(acao, extra = {}) {
      const r = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({pin, acao, ...extra})
      });
      return r.json();
    }

    function el(tag, cls, txt) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (txt !== undefined) e.textContent = txt;
      return e;
    }

    function mostrarLogin(msg = '') {
      $('#app').hidden = true; $('#login').hidden = false;
      $('#loginMsg').textContent = msg; $('#pin').value = '';
    }

    async function carregarHoje() {
      $('#msg').textContent = '';
      try {
        const r = await api('hoje');
        if (!r.ok) {
          if (r.auth === false) {localStorage.removeItem('pin'); pin = ''; return mostrarLogin(r.erro);}
          $('#msg').textContent = r.erro; return false;
        }
        doses = r.doses;
        $('#login').hidden = true; $('#app').hidden = false;
        const h = new Date().getHours();
        $('#saudacao').textContent = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
        $('#data').textContent = new Date().toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'});
        desenharDoses(true);
        return true;
      } catch (e) {
        $('#msg').textContent = 'Sem conexão. Tente atualizar.';
        $('#app').hidden = false; $('#login').hidden = true;
      }
    }

    function desenharDoses(animar) {
      const box = $('#doses'); box.innerHTML = '';
      if (!doses.length) box.append(el('p', 'empty', 'Nenhuma dose para hoje.'));
      let periodo = '', n = 0;
      doses.forEach(d => {
        const hora = parseInt(d.horario, 10);
        const p = hora < 12 ? 'Manhã' : hora < 18 ? 'Tarde' : 'Noite';
        if (p !== periodo) {
          periodo = p;
          const h = el('div', 'per'); h.innerHTML = ic(p === 'Noite' ? 'moon' : 'sun');
          h.append(document.createTextNode(p)); box.append(h);
        }
        const b = el('button', 'dose' + (d.tomou ? ' done' : ''));
        if (animar) b.style.setProperty('--d', (n++ * 50) + 'ms'); else b.style.animation = 'none';
        const tile = el('div', 'tile'); tile.innerHTML = ic('pill');
        const t = el('div', 't'); t.append(el('b', '', d.medicamento));
        const sp = el('span'); const em = el('em', '', d.horario);
        sp.append(em, document.createTextNode(' · ' + d.dosagem + (d.tomou && d.marcadoAs ? ' · tomou às ' + d.marcadoAs : '')));
        t.append(sp);
        const c = el('div', 'chk' + (d.recem ? ' pop' : '')); c.innerHTML = d.tomou ? CHECK : '';
        b.append(tile, t, c);
        b.onclick = () => alternar(d);
        box.append(b);
      });
      const feitas = doses.filter(d => d.tomou).length;
      const tudo = doses.length > 0 && feitas === doses.length;
      $('#prog').style.strokeDashoffset = 113.1 * (1 - (doses.length ? feitas / doses.length : 0));
      $('#ringTxt').textContent = `${feitas}/${doses.length}`;
      $('#ring').classList.toggle('full', tudo);
      $('#titulo').textContent = tudo ? 'Tudo certo por hoje' : 'Suas doses de hoje';
    }

    async function alternar(d) {
      d.tomou = !d.tomou; d.marcadoAs = d.tomou ? new Date().toTimeString().slice(0, 5) : '';
      d.recem = d.tomou; desenharDoses(); d.recem = false;
      try {
        const r = await api('marcar', {linha: d.linha, tomou: d.tomou});
        if (!r.ok) throw new Error(r.erro);
      } catch (e) {
        d.tomou = !d.tomou; desenharDoses();
        $('#msg').textContent = 'Não foi possível salvar. Verifique a conexão.';
      }
    }

    function iconeForma(f = '') {
      f = f.toLowerCase();
      return /gota|xarope/.test(f) ? 'droplet' : /inje/.test(f) ? 'syringe' : 'pill';
    }

    async function carregarMeds() {
      const box = $('#vMeds'); box.innerHTML = '';
      $('#msg').textContent = '';
      try {
        const r = await api('meds');
        if (!r.ok) {$('#msg').textContent = r.erro; return;}
        if (!r.meds.length) {
          box.append(el('p', 'empty', 'Nenhum medicamento encontrado. Preencha a aba Medicamentos da planilha (a coluna Nome comercial é obrigatória).'));
          return;
        }
        const lista = [...r.meds].sort((a, b) => (a.status === 'Ativo' ? 0 : 1) - (b.status === 'Ativo' ? 0 : 1));
        lista.forEach((m, i) => {
          const det = el('details', m.status === 'Ativo' ? '' : 'off');
          det.style.setProperty('--d', (i * 50) + 'ms');
          const s = el('summary');
          const tile = el('div', 'tile'); tile.innerHTML = ic(iconeForma(m.forma));
          const t = el('div', 't'); t.append(el('b', '', m.nome));
          const sub = [m.dosagem, m.posologia].filter(Boolean).join(' · ');
          if (sub) t.append(el('span', '', sub));
          if (m.paraQue) {t.append(document.createElement('br')); t.append(el('span', 'chip', m.paraQue));}
          s.append(tile, t); det.append(s);
          const dl = el('dl');
          [['Princípio ativo', m.ativo], ['Outros nomes', m.outros], ['Forma', m.forma], ['Horários', m.horarios],
          ['Observações', m.obs], ['Status', m.status]]
            .filter(x => x[1]).forEach(([k, v]) => {dl.append(el('dt', '', k), el('dd', '', v));});
          det.append(dl); box.append(det);
        });
      } catch (e) {
        $('#msg').textContent = 'Não foi possível carregar os medicamentos. Verifique a conexão e a implantação do Apps Script.';
      }
    }

    function aba(hoje) {
      $('#vHoje').hidden = !hoje; $('#vMeds').hidden = hoje;
      $('#tHoje').classList.toggle('on', hoje); $('#tMeds').classList.toggle('on', !hoje);
      if (!hoje) carregarMeds();
    }

    $('#entrar').onclick = async () => {
      pin = $('#pin').value.trim(); if (!pin) return;
      $('#loginMsg').textContent = 'Verificando…';
      if (await carregarHoje()) localStorage.setItem('pin', pin);
    };
    $('#pin').onkeydown = e => {if (e.key === 'Enter') $('#entrar').click();};
    $('#tHoje').onclick = () => aba(true);
    $('#tMeds').onclick = () => aba(false);
    $('#atualizar').onclick = e => {
      const b = e.currentTarget; b.classList.add('spin'); setTimeout(() => b.classList.remove('spin'), 750);
      $('#vMeds').hidden ? carregarHoje() : carregarMeds();
    };
    $('#sair').onclick = () => {localStorage.removeItem('pin'); pin = ''; mostrarLogin();};
    document.addEventListener('visibilitychange', () => {if (!document.hidden && pin) carregarHoje();});

    if (API_URL.includes('COLE_AQUI')) {
      mostrarLogin('Falta colar a URL do Apps Script no index.html (linha API_URL).');
    } else if (pin) {
      $('#app').hidden = false;
      $('#msg').textContent = 'Carregando…';
      carregarHoje();
    } else {
      mostrarLogin();
    }
  </script>
</body>

</html>
