<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c25577">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Medicações">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Minhas medicações</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --rose: #c25577;
      --rose-d: #a23f61;
      --rose-l: #fdf1f4;
      --rose-m: #f6d6df;
      --ink: #3a2a31;
      --mute: #94838a;
      --line: #f1dfe5;
      --bg: #fff3f6;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --display: 'Baloo 2', 'Nunito', sans-serif;
      --hero: linear-gradient(145deg, #d86a8d, #a9405f)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Nunito', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent
    }

    body {
      max-width: 520px;
      margin: 0 auto
    }

    button {
      font-family: inherit;
      cursor: pointer
    }

    :focus-visible {
      outline: 2px solid var(--rose);
      outline-offset: 3px
    }

    .i {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none
    }

    .flor {
      position: absolute;
      color: #fff;
      pointer-events: none
    }

    /* login */
    .login {
      position: fixed;
      inset: 0;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden
    }

    .login-top {
      padding: 12vh 28px 0;
      text-align: center
    }

    .login h1,
    .hero h1 {
      font-family: var(--display);
      font-weight: 600;
      letter-spacing: -.01em;
      margin: 0
    }

    .login h1 {
      font-size: 30px
    }

    .login p {
      color: var(--mute);
      margin: 8px 0 0
    }

    .login-card {
      position: relative;
      margin-top: auto;
      padding: 70px 28px calc(env(safe-area-inset-bottom) + 36px);
      background: var(--hero);
      border-radius: 64px 64px 0 0;
      text-align: center
    }

    .emblem {
      position: absolute;
      top: -1px;
      left: 50%;
      width: 84px;
      height: 84px;
      margin: -42px 0 0 -42px;
      border-radius: 50%;
      background: #fff;
      color: var(--rose);
      display: grid;
      place-items: center;
      box-shadow: 0 0 0 8px var(--bg), 0 10px 24px rgba(169, 64, 95, .25);
      animation: flutuar 4s ease-in-out infinite
    }

    .emblem .i {
      width: 36px;
      height: 36px;
      stroke-width: 1.8
    }

    @keyframes flutuar {
      50% {
        transform: translateY(-4px)
      }
    }

    .login input {
      position: relative;
      width: 100%;
      font: 700 26px 'Nunito';
      text-align: center;
      letter-spacing: .4em;
      padding: 14px;
      border: 0;
      border-radius: 18px;
      background: rgba(255, 255, 255, .18);
      color: #fff;
      transition: background .2s, box-shadow .2s
    }

    .login input::placeholder {
      color: rgba(255, 255, 255, .6);
      letter-spacing: .2em
    }

    .login input:focus {
      outline: 0;
      background: rgba(255, 255, 255, .28);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .5)
    }

    .login .msg {
      color: #fff;
      position: relative
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 18px;
      background: #fff;
      color: var(--rose-d);
      font-weight: 700;
      font-size: 16px;
      transition: transform .15s var(--ease), box-shadow .2s
    }

    .btn:active {
      transform: scale(.97)
    }

    /* topo */
    .hero {
      position: relative;
      background: radial-gradient(circle at 88% 0%, rgba(255, 255, 255, .24), transparent 50%), var(--hero);
      color: #fff;
      padding: calc(env(safe-area-inset-top) + 14px) 22px 34px;
      border-radius: 0 0 42px 42px;
      box-shadow: 0 18px 34px rgba(169, 64, 95, .22)
    }

    .deco {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      pointer-events: none
    }

    .top,
    .row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px
    }

    .top {
      margin-bottom: 20px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font: 600 15px var(--display);
      opacity: .95
    }

    .brand .i {
      width: 18px;
      height: 18px
    }

    .menu {
      position: relative
    }

    #menuBtn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .2);
      color: #fff;
      display: grid;
      place-items: center;
      transition: background .2s, transform .15s var(--ease)
    }

    #menuBtn:active {
      transform: scale(.92)
    }

    .hi {
      margin: 0;
      opacity: .85;
      font-weight: 600
    }

    .hero h1 {
      font-size: 28px;
      line-height: 1.1;
      margin: 2px 0 6px
    }

    .data {
      margin: 0;
      opacity: .85;
      font-size: 14px
    }

    .data::first-letter {
      text-transform: uppercase
    }

    .f1 {
      width: 140px;
      height: 140px;
      right: -36px;
      top: -34px;
      opacity: .16;
      transform: rotate(15deg);
      animation: girar 40s linear infinite;
      stroke-width: 1.1
    }

    .f2 {
      width: 80px;
      height: 80px;
      left: 42%;
      bottom: -22px;
      opacity: .14;
      stroke-width: 1.1
    }

    @keyframes girar {
      to {
        transform: rotate(375deg)
      }
    }

    .ring {
      position: relative;
      width: 76px;
      height: 76px;
      flex: none
    }

    .ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg)
    }

    .ring circle {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round
    }

    .ring .trk {
      stroke: rgba(255, 255, 255, .25)
    }

    .ring .val {
      stroke: #fff;
      stroke-dasharray: 113.1;
      stroke-dashoffset: 113.1;
      transition: stroke-dashoffset .6s var(--ease)
    }

    .ring b {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-variant-numeric: tabular-nums
    }

    .ring.full {
      animation: pulso .8s var(--ease)
    }

    @keyframes pulso {
      40% {
        transform: scale(1.12)
      }
    }

    main {
      padding-bottom: 110px
    }

    .wrap {
      padding: 0 18px
    }

    .msg {
      color: var(--rose-d);
      min-height: 20px;
      margin: 12px 22px 0;
      font-size: 14px
    }

    .per {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 4px 10px;
      color: var(--rose-d);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase
    }

    .per::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line)
    }

    .dose,
    details {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      margin-bottom: 10px;
      transition: transform .15s var(--ease), border-color .2s, background .25s, box-shadow .2s;
      animation: subir .45s var(--ease) both;
      animation-delay: var(--d, 0s)
    }

    @keyframes subir {
      from {
        opacity: 0;
        transform: translateY(10px)
      }
    }

    .dose {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      text-align: left;
      padding: 13px 15px 13px 13px;
      color: inherit
    }

    .dose:active {
      transform: scale(.975)
    }

    .tile {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      background: var(--rose-l);
      color: var(--rose);
      display: grid;
      place-items: center;
      flex: none;
      transition: transform .3s var(--ease), background .25s, color .25s
    }

    .t {
      flex: 1;
      min-width: 0
    }

    .t b {
      display: block;
      font-size: 16px
    }

    .t span {
      color: var(--mute);
      font-size: 14px
    }

    .t em {
      font-style: normal;
      color: var(--rose-d);
      font-weight: 700
    }

    .chk {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--rose-m);
      display: grid;
      place-items: center;
      flex: none;
      transition: background .25s, border-color .25s
    }

    .chk svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .chk path {
      stroke-dasharray: 24
    }

    .chk.pop {
      animation: pop .4s var(--ease)
    }

    .chk.pop path {
      animation: draw .35s .05s var(--ease) both
    }

    @keyframes pop {
      0% {
        transform: scale(.6)
      }

      60% {
        transform: scale(1.2)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes draw {
      from {
        stroke-dashoffset: 24
      }

      to {
        stroke-dashoffset: 0
      }
    }

    .dose.done {
      background: var(--rose-l);
      border-color: var(--rose-m)
    }

    .dose.done .chk {
      background: var(--rose);
      border-color: var(--rose)
    }

    .dose.done .tile {
      background: var(--rose);
      color: #fff
    }

    details {
      padding: 0 14px
    }

    details[open] {
      border-color: var(--rose-m);
      box-shadow: 0 8px 20px rgba(194, 85, 119, .1)
    }

    details.off {
      opacity: .6
    }

    summary {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 26px 13px 0;
      cursor: pointer;
      list-style: none
    }

    summary::-webkit-details-marker {
      display: none
    }

    summary::after {
      content: "";
      position: absolute;
      right: 4px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--rose);
      border-bottom: 2px solid var(--rose);
      transform: translateY(-70%) rotate(45deg);
      transition: transform .25s var(--ease)
    }

    details[open] summary::after {
      transform: translateY(-30%) rotate(-135deg)
    }

    .chip {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 10px;
      border-radius: 99px;
      background: var(--rose-l);
      color: var(--rose-d);
      font-size: 12px;
      font-weight: 700
    }

    dl {
      margin: 0 0 14px;
      display: grid;
      grid-template-columns: 105px 1fr;
      gap: 8px 10px;
      font-size: 14px;
      animation: subir .3s var(--ease)
    }

    dt {
      color: var(--mute)
    }

    dd {
      margin: 0
    }

    .empty {
      color: var(--mute);
      text-align: center;
      padding: 36px 12px
    }

    /* navegação */
    .nav {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 14px);
      transform: translateX(-50%);
      width: calc(100% - 56px);
      max-width: 340px;
      display: flex;
      gap: 4px;
      padding: 6px;
      background: linear-gradient(145deg, rgba(216, 106, 141, .96), rgba(169, 64, 95, .96));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 26px;
      box-shadow: 0 16px 32px rgba(169, 64, 95, .35);
      z-index: 5
    }

    .nav button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 12px 0;
      border: 0;
      border-radius: 20px;
      background: none;
      color: rgba(255, 255, 255, .85);
      font: 600 14px var(--display);
      transition: background .25s, color .25s, transform .15s var(--ease)
    }

    .nav button:active {
      transform: scale(.95)
    }

    .nav button.on {
      background: #fff;
      color: var(--rose-d)
    }

    .menu-pop {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 230px;
      white-space: nowrap;
      padding: 6px;
      background: #fff;
      color: var(--ink);
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(58, 42, 49, .25);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px) scale(.95);
      transform-origin: top right;
      transition: opacity .2s, transform .25s var(--ease), visibility .2s;
      z-index: 10
    }

    .menu.open .menu-pop {
      opacity: 1;
      visibility: visible;
      transform: none
    }

    .menu-pop button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 12px;
      background: none;
      color: var(--ink);
      font: 600 14px var(--display);
      text-align: left;
      transition: background .2s
    }

    .menu-pop button:active {
      background: var(--rose-l)
    }

    .menu-pop .i {
      width: 18px;
      height: 18px;
      color: var(--rose)
    }

    .spin .i {
      animation: rodar .7s var(--ease)
    }

    @keyframes rodar {
      to {
        transform: rotate(360deg)
      }
    }

    [hidden] {
      display: none !important
    }

    @media (hover:hover) {
      .dose:hover {
        border-color: var(--rose-m);
        box-shadow: 0 8px 18px rgba(194, 85, 119, .12);
        transform: translateY(-2px)
      }

      .dose:hover .tile {
        transform: rotate(-6deg) scale(1.06)
      }

      .dose:hover .chk {
        border-color: var(--rose)
      }

      details:hover {
        border-color: var(--rose-m)
      }

      .btn:hover {
        box-shadow: 0 8px 20px rgba(0, 0, 0, .15)
      }

      .nav button:not(.on):hover {
        background: rgba(255, 255, 255, .18);
        color: #fff
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }
    }

    /* acabamento */
    .t b,
    .t em,
    .ring b,
    .chip,
    .btn,
    .per,
    .login h1 {
      font-family: var(--display)
    }

    .t b {
      font-weight: 600;
      font-size: 17px
    }

    .t em {
      font-weight: 600
    }

    .dose,
    details {
      box-shadow: 0 1px 2px rgba(58, 42, 49, .04), 0 8px 22px rgba(58, 42, 49, .045)
    }

    .dose.done {
      background: linear-gradient(135deg, var(--rose-l), #fff)
    }

    .chip {
      margin-top: 5px;
      font-weight: 600
    }

    .chip+.chip {
      margin-left: 6px
    }

    .chip.off {
      background: #f1ecee;
      color: var(--mute)
    }

    .chip.o {
      background: #fff;
      box-shadow: inset 0 0 0 1px var(--rose-m)
    }

    .info {
      display: grid;
      gap: 12px;
      padding: 2px 0 16px;
      animation: subir .3s var(--ease)
    }

    .rowi {
      display: flex;
      gap: 12px;
      align-items: flex-start
    }

    .info>.rowi+.rowi {
      border-top: 1px dashed var(--line);
      padding-top: 12px
    }

    .mini {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--rose-l);
      color: var(--rose);
      display: grid;
      place-items: center;
      flex: none
    }

    .mini .i {
      width: 18px;
      height: 18px
    }

    .cont {
      flex: 1;
      min-width: 0
    }

    .k {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mute);
      margin-bottom: 2px
    }

    .v {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px
    }

    .chips .chip {
      margin: 0
    }

    .info>.rowi.note,
    .info>.rowi+.rowi.note {
      background: var(--rose-l);
      border: 0;
      border-left: 3px solid var(--rose);
      border-radius: 14px;
      padding: 12px
    }

    .note .mini {
      background: #fff
    }

    /* nav com 3 abas */
    .nav {
      max-width: 380px
    }

    .nav button {
      font-size: 13px;
      gap: 5px
    }

    .nav .i {
      width: 19px;
      height: 19px
    }

    /* pressão */
    .pcard {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(58, 42, 49, .04), 0 8px 22px rgba(58, 42, 49, .045);
      animation: subir .45s var(--ease) both
    }

    .ptit {
      font: 600 17px var(--display);
      margin: 0 0 12px
    }

    .pgrid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: end
    }

    .pgrid label {
      display: block
    }

    .pgrid label span,
    .pul span {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mute);
      margin-bottom: 6px;
      text-align: center
    }

    .pgrid input,
    .pul input {
      width: 100%;
      border: 1.5px solid transparent;
      border-radius: 16px;
      background: var(--rose-l);
      color: var(--ink);
      text-align: center;
      font: 600 30px var(--display);
      padding: 10px 4px;
      transition: border-color .2s, box-shadow .2s, background .2s;
      -moz-appearance: textfield
    }

    .pgrid input::-webkit-outer-spin-button,
    .pgrid input::-webkit-inner-spin-button,
    .pul input::-webkit-outer-spin-button,
    .pul input::-webkit-inner-spin-button {
      -webkit-appearance: none
    }

    .pgrid input::placeholder,
    .pul input::placeholder {
      color: #d9bfc7
    }

    .pgrid input:focus,
    .pul input:focus {
      outline: 0;
      background: #fff;
      border-color: var(--rose);
      box-shadow: 0 0 0 4px var(--rose-l)
    }

    .pbar {
      font: 500 30px var(--display);
      color: var(--rose-m);
      padding-bottom: 10px
    }

    .pul {
      margin-top: 12px
    }

    .pul input {
      font-size: 20px;
      padding: 8px
    }

    .psave {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: 0;
      border-radius: 16px;
      background: var(--hero);
      color: #fff;
      font: 600 16px var(--display);
      box-shadow: 0 8px 18px rgba(169, 64, 95, .28);
      transition: transform .15s var(--ease), box-shadow .2s, opacity .2s
    }

    .psave:active {
      transform: scale(.97)
    }

    .psave:disabled {
      opacity: .6
    }

    .pnota {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      margin: 10px 0 0;
      color: var(--mute);
      font-size: 13px
    }

    .pnota .i {
      width: 15px;
      height: 15px;
      color: var(--rose)
    }

    .pres {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px
    }

    .pres .big {
      font: 600 38px/1 var(--display);
      letter-spacing: -.02em
    }

    .pres small {
      display: block;
      color: var(--mute);
      font-size: 13px;
      margin-top: 4px
    }

    .pres .med {
      text-align: right;
      font-size: 13px;
      color: var(--mute)
    }

    .pres .med b {
      display: block;
      font: 600 20px var(--display);
      color: var(--ink)
    }

    .pstat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 11px 3px 9px;
      border-radius: 99px;
      background: var(--rose-l);
      font: 600 12.5px var(--display);
      color: var(--ink)
    }

    .pstat i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c, #999)
    }

    .palerta {
      margin: 12px 0 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--rose-l);
      border-left: 3px solid var(--rose);
      font-size: 13px;
      line-height: 1.4
    }

    .graf {
      width: 100%;
      height: auto;
      margin-top: 6px;
      overflow: visible
    }

    .graf polyline {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      animation: tracar 1.1s var(--ease) both
    }

    .graf .ls {
      stroke: var(--rose)
    }

    .graf .ld {
      stroke: #e8a6b8
    }

    .graf .ds circle {
      fill: var(--rose)
    }

    .graf .dd circle {
      fill: #e8a6b8
    }

    @keyframes tracar {
      from {
        stroke-dashoffset: 1
      }

      to {
        stroke-dashoffset: 0
      }
    }

    .leg {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--mute);
      margin-top: 6px
    }

    .leg i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: -1px
    }

    .pitem {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 8px 12px 14px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(58, 42, 49, .04);
      animation: subir .4s var(--ease) both;
      animation-delay: var(--d, 0s)
    }

    .pitem .pm {
      flex: 1;
      min-width: 0
    }

    .pitem .pm b {
      display: block;
      font: 600 20px var(--display)
    }

    .pitem .pm span {
      color: var(--mute);
      font-size: 13px
    }

    .pdel {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 12px;
      background: none;
      color: #cdb5bd;
      display: grid;
      place-items: center;
      transition: background .2s, color .2s
    }

    .pdel .i {
      width: 17px;
      height: 17px
    }

    .pdel:active {
      background: var(--rose-l);
      color: var(--rose-d)
    }

    .pfoot {
      color: var(--mute);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
      margin: 14px 8px 0
    }

    @media (hover:hover) {
      .pdel:hover {
        background: var(--rose-l);
        color: var(--rose-d)
      }

      .psave:hover {
        box-shadow: 0 12px 24px rgba(169, 64, 95, .36)
      }
    }

    /* cadastro de medicamentos */
    .addmed {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1.5px dashed var(--rose-m);
      border-radius: 18px;
      background: rgba(255, 255, 255, .6);
      color: var(--rose-d);
      font: 600 15px var(--display);
      transition: background .2s, transform .15s var(--ease), border-color .2s
    }

    .addmed:active {
      transform: scale(.98)
    }

    .edit-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 14px;
      padding: 9px 14px;
      border: 0;
      border-radius: 12px;
      background: var(--rose-l);
      color: var(--rose-d);
      font: 600 14px var(--display);
      transition: background .2s, transform .15s var(--ease)
    }

    .edit-btn .i {
      width: 16px;
      height: 16px
    }

    .edit-btn:active {
      transform: scale(.96)
    }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center
    }

    .sheet-bg {
      position: absolute;
      inset: 0;
      background: rgba(58, 42, 49, .38);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      opacity: 0;
      transition: opacity .25s
    }

    .sheet-card {
      position: relative;
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-radius: 28px 28px 0 0;
      box-shadow: 0 -12px 40px rgba(58, 42, 49, .22);
      transform: translateY(100%);
      transition: transform .35s var(--ease)
    }

    .sheet.open .sheet-bg {
      opacity: 1
    }

    .sheet.open .sheet-card {
      transform: none
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 8px
    }

    .sheet-head h2 {
      font: 600 20px var(--display);
      margin: 0
    }

    .sheet-head button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: var(--rose-l);
      color: var(--rose-d);
      display: grid;
      place-items: center
    }

    .sheet-body {
      overflow: auto;
      padding: 8px 20px 12px;
      display: grid;
      gap: 14px;
      -webkit-overflow-scrolling: touch
    }

    .f {
      display: block
    }

    .f>span,
    .f label>span {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mute);
      margin-bottom: 6px
    }

    .fg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .f input,
    .f select,
    .f textarea {
      width: 100%;
      border: 1.5px solid transparent;
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font: 600 16px 'Nunito', sans-serif;
      padding: 12px 14px;
      box-shadow: 0 1px 2px rgba(58, 42, 49, .05);
      transition: border-color .2s, box-shadow .2s;
      resize: vertical
    }

    .f input:focus,
    .f select:focus,
    .f textarea:focus {
      outline: 0;
      border-color: var(--rose);
      box-shadow: 0 0 0 4px var(--rose-l)
    }

    .pre {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px
    }

    .pre button {
      border: 0;
      border-radius: 99px;
      padding: 6px 12px;
      background: var(--rose-l);
      color: var(--rose-d);
      font: 600 13px var(--display);
      transition: background .2s, transform .15s var(--ease)
    }

    .pre button:active {
      transform: scale(.94);
      background: var(--rose-m)
    }

    .horas {
      display: flex;
      gap: 8px
    }

    .horas input {
      flex: 1
    }

    .horas button {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 0;
      border-radius: 14px;
      padding: 0 16px;
      background: var(--rose);
      color: #fff;
      font: 600 14px var(--display);
      transition: transform .15s var(--ease)
    }

    .horas button:active {
      transform: scale(.95)
    }

    .horas .i {
      width: 16px;
      height: 16px
    }

    .hchips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      min-height: 8px
    }

    .hchip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 6px 6px 14px;
      border-radius: 99px;
      background: #fff;
      box-shadow: inset 0 0 0 1.5px var(--rose-m);
      font: 600 15px var(--display);
      font-variant-numeric: tabular-nums;
      animation: pop .3s var(--ease)
    }

    .hchip button {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      background: var(--rose-l);
      color: var(--rose-d);
      display: grid;
      place-items: center
    }

    .hchip .i {
      width: 13px;
      height: 13px
    }

    .hint {
      color: var(--mute);
      font-size: 13px
    }

    .seg {
      display: flex;
      background: var(--rose-l);
      padding: 4px;
      border-radius: 14px;
      gap: 4px
    }

    .seg button {
      flex: 1;
      border: 0;
      background: none;
      border-radius: 10px;
      padding: 10px;
      font: 600 14px var(--display);
      color: var(--mute);
      transition: background .25s, color .25s, box-shadow .25s
    }

    .seg button.on {
      background: #fff;
      color: var(--rose-d);
      box-shadow: 0 1px 4px rgba(194, 85, 119, .2)
    }

    .sheet-foot {
      display: flex;
      gap: 10px;
      padding: 12px 20px calc(env(safe-area-inset-bottom) + 16px);
      border-top: 1px solid var(--line)
    }

    .sheet-foot .psave {
      flex: 1
    }

    .danger {
      border: 1.5px solid var(--rose-m);
      background: #fff;
      color: var(--rose-d);
      border-radius: 16px;
      padding: 0 18px;
      font: 600 15px var(--display);
      transition: background .2s
    }

    .danger:active {
      background: var(--rose-l)
    }

    @media (hover:hover) {
      .addmed:hover {
        background: #fff;
        border-color: var(--rose)
      }

      .edit-btn:hover {
        background: var(--rose-m)
      }

      .pre button:hover {
        background: var(--rose-m)
      }
    }

    /* nav: rótulo só na aba ativa */
    .nav button {
      flex: 1;
      gap: 0;
      transition: flex .35s var(--ease), background .25s, color .25s, transform .15s var(--ease)
    }

    .nav button.on {
      flex: 2.1
    }

    .nav button span {
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: max-width .35s var(--ease), opacity .25s, margin .35s var(--ease)
    }

    .nav button.on span {
      max-width: 90px;
      opacity: 1;
      margin-left: 6px
    }

    /* itens */
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 12px 12px 12px 13px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(58, 42, 49, .04), 0 8px 22px rgba(58, 42, 49, .045);
      animation: subir .45s var(--ease) both;
      animation-delay: var(--d, 0s);
      transition: border-color .25s, background .25s
    }

    .item .t b {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .item.low {
      background: linear-gradient(135deg, #fff7ec, #fff);
      border-color: #f3dcb8
    }

    .item.low .tile {
      background: #fdebd0;
      color: #b9741a
    }

    .item.low .step b {
      color: #b9741a
    }

    .step {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--rose-l);
      border-radius: 14px;
      padding: 3px;
      flex: none
    }

    .step button {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 11px;
      background: #fff;
      color: var(--rose-d);
      display: grid;
      place-items: center;
      box-shadow: 0 1px 3px rgba(194, 85, 119, .18);
      transition: transform .15s var(--ease), background .2s
    }

    .step button:active {
      transform: scale(.86);
      background: var(--rose-m)
    }

    .step .i {
      width: 16px;
      height: 16px
    }

    .step b {
      min-width: 34px;
      text-align: center;
      font: 600 17px var(--display);
      font-variant-numeric: tabular-nums
    }

    .bump {
      animation: bump .3s var(--ease)
    }

    @keyframes bump {
      40% {
        transform: scale(1.28)
      }
    }

    /* tratamento */
    .sw {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(58, 42, 49, .05);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer
    }

    .sw input {
      position: absolute;
      opacity: 0;
      pointer-events: none
    }

    .sw i {
      width: 44px;
      height: 26px;
      border-radius: 99px;
      background: var(--rose-m);
      position: relative;
      flex: none;
      transition: background .25s
    }

    .sw i::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
      transition: transform .25s var(--ease)
    }

    .sw input:checked+i {
      background: var(--rose)
    }

    .sw input:checked+i::after {
      transform: translateX(18px)
    }

    .sw input:focus-visible+i {
      outline: 2px solid var(--rose);
      outline-offset: 2px
    }

    .chip.trat {
      background: var(--rose);
      color: #fff
    }

    .chip.trat .i {
      width: 12px;
      height: 12px;
      margin-right: 4px;
      vertical-align: -2px
    }

    /* agenda */
    .calcard {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(58, 42, 49, .04), 0 8px 22px rgba(58, 42, 49, .045)
    }

    .cal-cab {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px
    }

    .cal-cab b {
      font: 600 17px var(--display);
      text-transform: capitalize
    }

    .cal-cab button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 12px;
      background: var(--rose-l);
      color: var(--rose-d);
      display: grid;
      place-items: center;
      transition: transform .15s var(--ease)
    }

    .cal-cab button:active {
      transform: scale(.9)
    }

    .cal-sem,
    .cal-grade {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px
    }

    .cal-sem span {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--mute);
      padding: 4px 0
    }

    .dia {
      aspect-ratio: 1/1.08;
      border: 0;
      border-radius: 14px;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--ink);
      transition: transform .15s var(--ease)
    }

    .dia:active {
      transform: scale(.9)
    }

    .dia .n {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 600 15px var(--display);
      transition: background .2s, color .2s
    }

    .dia.hoje .n {
      background: var(--rose-l);
      color: var(--rose-d)
    }

    .dia.sel .n {
      background: var(--rose);
      color: #fff
    }

    .marcas {
      display: flex;
      gap: 3px;
      height: 6px
    }

    .m {
      width: 6px;
      height: 6px;
      border-radius: 50%
    }

    .m.ses {
      background: var(--rose)
    }

    .m.rem {
      background: #9b8cd9
    }

    .m.aut {
      background: #d9a441
    }

    .m.out {
      background: #7fb3a6
    }

    .leg2 {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 12px;
      color: var(--mute);
      margin-top: 10px
    }

    .leg2 .m {
      display: inline-block;
      margin-right: 5px;
      vertical-align: 0
    }

    .evc {
      cursor: pointer
    }

    .evc.done {
      background: linear-gradient(135deg, var(--rose-l), #fff);
      border-color: var(--rose-m)
    }

    .evc .chk {
      cursor: pointer
    }

    .evc.done .chk {
      background: var(--rose);
      border-color: var(--rose)
    }

    .lemb {
      background: linear-gradient(135deg, #fff7ec, #fff);
      border: 1px solid #f3dcb8;
      border-radius: 20px;
      padding: 4px 14px;
      margin-bottom: 14px;
      animation: subir .45s var(--ease) both
    }

    .lrow {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0
    }

    .lrow+.lrow {
      border-top: 1px dashed #f0dfc6
    }

    .lrow .tile {
      background: #fdebd0;
      color: #b9741a;
      width: 40px;
      height: 40px;
      border-radius: 13px
    }

    .lrow.late .tile {
      background: var(--rose-m);
      color: var(--rose-d)
    }

    .lrow .t b {
      font-size: 15px
    }

    .lrow .t span {
      font-size: 13px
    }

    .ja {
      border: 0;
      border-radius: 12px;
      padding: 8px 12px;
      background: var(--rose);
      color: #fff;
      font: 600 13px var(--display);
      flex: none;
      transition: transform .15s var(--ease)
    }

    .ja:active {
      transform: scale(.94)
    }

    /* calendário colorido */
    .cal-grade {
      gap: 4px 0
    }

    .dia {
      border-radius: 14px
    }

    .dia.sel .n {
      background: transparent;
      color: var(--ink);
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--rose-d)
    }

    .dia.hoje .n {
      background: var(--rose-l);
      color: var(--rose-d)
    }

    .dia .n {
      position: relative
    }

    .dia .n.um {
      background: var(--c);
      color: #fff
    }

    .dia .n.multi {
      background: var(--g);
      color: var(--ink)
    }

    .dia .n.multi::before {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: #fff
    }

    .dia .n.multi span {
      position: relative
    }

    .dia.rem {
      background: #efeafb;
      border-radius: 0
    }

    .dia.rem.rini {
      border-radius: 14px 0 0 14px
    }

    .dia.rem.rfim {
      border-radius: 0 14px 14px 0
    }

    .dia.rem.rini.rfim {
      border-radius: 14px
    }

    .tile.ses {
      background: #fbe3ea;
      color: var(--rose-d)
    }

    .tile.rem {
      background: #efeafb;
      color: #6f5bc0
    }

    .tile.out {
      background: #e3f1ed;
      color: #3f7d6e
    }

    .pdata {
      width: 48px;
      height: 52px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: none;
      line-height: 1.05
    }

    .pdata b {
      font: 600 20px var(--display)
    }

    .pdata span {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .pdata.ses {
      background: #fbe3ea;
      color: var(--rose-d)
    }

    .pdata.rem {
      background: #efeafb;
      color: #6f5bc0
    }

    .pdata.out {
      background: #e3f1ed;
      color: #3f7d6e
    }

    .prox {
      cursor: pointer
    }

    .pfechar {
      margin-left: auto;
      order: 3;
      border: 0;
      background: var(--rose-l);
      color: var(--rose-d);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: none
    }

    .pfechar .i {
      width: 14px;
      height: 14px
    }

    .per {
      width: 100%
    }

    /* cartões de item e de agenda mais completos */
    .item .t span {
      display: block
    }

    .item .t .obs {
      display: flex;
      gap: 6px;
      align-items: flex-start;
      margin-top: 4px;
      font-size: 13px;
      line-height: 1.35
    }

    .item .t .obs .i {
      width: 14px;
      height: 14px;
      margin-top: 1px;
      color: var(--rose)
    }

    .stepcol {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: none
    }

    .stepcol small {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--mute);
      max-width: 96px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .item.low .stepcol small {
      color: #b9741a
    }
  </style>
</head>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbygi4DMEklucoLk_H2q8SPpUq-h3Y-r52xIy5zKFYcW95G6CPohunB_8MKD0q7L2Wje/exec';
    const $ = s => document.querySelector(s);
    let pin = localStorage.getItem('pin') || '';
    let doses = [];
    const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const ic = n => `<svg class="i"><use href="#i-${n}"/></svg>`;

    async function api(acao, extra = {}) {
      let r;
      try {
        r = await fetch(API_URL, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=utf-8'},
          body: JSON.stringify({pin, acao, ...extra})
        });
      } catch (e) {const err = new Error('rede'); err.tipo = 'rede'; throw err;}
      const txt = await r.text();
      try {return JSON.parse(txt);}
      catch (e) {const err = new Error('resposta'); err.tipo = 'resposta'; err.status = r.status; throw err;}
    }

    // Explica o que deu errado (internet, resposta do Apps Script ou erro do próprio app)
    function motivoErro(e) {
      console.error(e);
      if (e && e.tipo === 'rede') return 'Sem conexão com o servidor. Verifique a internet, a URL do Apps Script (API_URL) e se a implantação está com acesso para “Qualquer pessoa”.';
      if (e && e.tipo === 'resposta') return 'O Apps Script respondeu algo inesperado. Confira se a implantação foi atualizada (Nova versão) e se o código não tem erro.';
      return 'Erro no app: ' + (e && e.message ? e.message : e);
    }

    function el(tag, cls, txt) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (txt !== undefined) e.textContent = txt;
      return e;
    }

    function mostrarLogin(msg = '') {
      $('#app').hidden = true; $('#login').hidden = false;
      $('#loginMsg').textContent = msg; $('#pin').value = '';
    }

    const ultima = {};
    const fresco = k => Date.now() - (ultima[k] || 0) < 45000;
    const hojeChave = () => new Date().toLocaleDateString('sv');
    function lerCache(k) {try {return JSON.parse(localStorage.getItem('cache:' + k));} catch (e) {return null;} }
    function gravarCache(k, v) {try {localStorage.setItem('cache:' + k, JSON.stringify(v));} catch (e) { /* sem espaço */} }
    function limparCache() {Object.keys(localStorage).filter(k => k.startsWith('cache:')).forEach(k => localStorage.removeItem(k));}
    let jaDesenhado = false, diaCarregado = '', prefetchFeito = false;

    function cabecalhoHoje() {
      const h = new Date().getHours();
      $('#saudacao').textContent = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
      $('#data').textContent = new Date().toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'});
    }

    async function carregarHoje(forcar) {
      if (!forcar && jaDesenhado && fresco('hoje') && diaCarregado === hojeChave()) return true;
      $('#msg').textContent = '';
      try {
        const r = await api('hoje', {forcar: !!forcar});
        if (!r.ok) {
          if (r.auth === false) {localStorage.removeItem('pin'); pin = ''; limparCache(); return mostrarLogin(r.erro);}
          $('#msg').textContent = r.erro; return false;
        }
        const mudou = JSON.stringify(r.doses) !== JSON.stringify(doses);
        doses = r.doses; ultima.hoje = Date.now(); diaCarregado = hojeChave();
        $('#login').hidden = true; $('#app').hidden = false;
        cabecalhoHoje(); atualizarLembretes();
        if (mudou || !jaDesenhado) desenharDoses(!jaDesenhado);
        jaDesenhado = true;
        if (!prefetchFeito) {prefetchFeito = true; setTimeout(prefetch, 500);}
        return true;
      } catch (e) {
        $('#msg').textContent = motivoErro(e);
        $('#app').hidden = false; $('#login').hidden = true;
      }
    }

    // Depois de mostrar "Hoje", busca o resto numa única chamada para as outras abas abrirem na hora.
    async function prefetch() {
      try {
        const r = await api('resto');
        if (!r.ok) return;
        listaMeds = r.meds; itens = r.itens; itensP = r.pressao;
        eventos = r.eventos || [];
        gravarCache('meds', r.meds); gravarCache('itens', r.itens); gravarCache('press', r.pressao); gravarCache('agenda', eventos);
        ultima.meds = ultima.itens = ultima.press = ultima.agenda = Date.now();
        atualizarLembretes();
      } catch (e) { /* segue sem pré-carregar */}
    }

    function desenharDoses(animar) {
      const box = $('#doses'); box.innerHTML = '';
      if (!doses.length) box.append(el('p', 'empty', 'Nenhuma dose para hoje.'));
      let periodo = '', n = 0;
      doses.forEach(d => {

    function grafico(its) {
      const d = its.slice(0, 14).reverse(); if (d.length < 2) return '';

      const lo = Math.min(...d.map(x => x.dia)) - 10, hi = Math.max(...d.map(x => x.sis)) + 10;
      const X = i => px + i * (W - 2 * px) / (d.length - 1), Y = v => py + (hi - v) * (H - 2 * py) / (hi - lo);
      const pts = k => d.map((x, i) => `${X(i).toFixed(1)},${Y(x[k]).toFixed(1)}`).join(' ');
      const dots = k => d.map((x, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(x[k]).toFixed(1)}" r="3"/>`).join('');
      return `<svg class="graf" viewBox="0 0 ${W} ${H}"><polyline class="ld" pathLength="1" points="${pts('dia')}"/><g class="dd">${dots('dia')}</g><polyline class="ls" pathLength="1" points="${pts('sis')}"/><g class="ds">${dots('sis')}</g></svg>

    }

    function linhaItem(it, idx, mostrarCat) {
      const r = el('div', 'item' + (baixo(it) ? ' low' : ''));
      if (idx >= 0) r.style.setProperty('--d', Math.min(idx, 10) * 40 + 'ms'); else r.style.animation = 'none';
      const tile = el('div', 'tile'); tile.innerHTML = ic(baixo(it) ? 'alert' : 'box');
      const t = el('div', 't'); t.append(el('b', '', it.nome));
      const partes = [];
      if (mostrarCat && it.categoria) partes.push(it.categoria);
      if (it.min > 0) partes.push('avisar com ' + fmtN(it.min) + ' ou menos');
      if (partes.length) t.append(el('span', '', partes.join(' · ')));
      if (it.obs) {const o = el('span', 'obs'); o.innerHTML = ic('info'); o.append(document.createTextNode(it.obs)); t.append(o);}
      const st = el('div', 'step');
      const menos = el('button'); menos.setAttribute('aria-label', 'Diminuir'); menos.innerHTML = ic('minus');
      const mais = el('button'); mais.setAttribute('aria-label', 'Aumentar'); mais.innerHTML = ic('plus');
      const q = el('b', '', fmtN(it.qtd));
      menos.onclick = ev => {ev.stopPropagation(); ajustar(it, -1, q, r);};
      mais.onclick = ev => {ev.stopPropagation(); ajustar(it, 1, q, r);};
      st.append(menos, q, mais);
      const col = el('div', 'stepcol'); col.append(st);
      if (it.unidade) col.append(el('small', '', it.unidade));

      r.style.cursor = 'pointer'; r.onclick = () => abrirEditorItem(it);

    }

    async function ajustar(it, delta, q, row) {
      if (delta < 0 && it.qtd <= 0) return;
      it.qtd = Math.max(0, it.qtd + delta); q.textContent = fmtN(it.qtd);
      q.classList.remove('bump'); void q.offsetWidth; q.classList.add('bump');
      row.classList.toggle('low', baixo(it)); gravarCache('itens', itens);
      clearTimeout(tRe); tRe = setTimeout(() => desenharItens(false), 1000);
      try {
        const r = await api('item_ajustar', {linha: it.linha, nome: it.nome, delta});
        if (!r.ok) throw new Error(r.erro);
      } catch (e) {
        it.qtd = Math.max(0, it.qtd - delta); q.textContent = fmtN(it.qtd);
        $('#msg').textContent = 'Não foi possível salvar. Atualize e tente de novo.';
      }
    }

    }

    $('#iEscolher').onchange = e => preencherI(itens.find(x => String(x.linha) === e.target.value));
    $('#iSalvar').onclick = salvarItem; $('#iExcluir').onclick = excluirItem;
    $('#iFechar').onclick = () => esconderSheet($('#sheetI')); $('#iBg').onclick = () => esconderSheet($('#sheetI'));
    document.addEventListener('keydown', e => {if (e.key === 'Escape' && !$('#sheetI').hidden) esconderSheet($('#sheetI'));});

    let eventos = [], editE = null, tipoE = 'Sessão', diaSel = '';
    let mesRef = new Date(); mesRef = new Date(mesRef.getFullYear(), mesRef.getMonth(), 1);
    const isoDe = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const doIso = x => {const [a, b, c] = x.split('-').map(Number); return new Date(a, b - 1, c);};
    const fmtData = x => x.slice(8, 10) + '/' + x.slice(5, 7);
    const somaDias = (x, n) => {const d = doIso(x); d.setDate(d.getDate() + n); return isoDe(d);};
    const diasAte = x => Math.round((doIso(x) - doIso(isoDe(new Date()))) / 86400000);
    const cobre = (e, x) => e.data <= x && x <= (e.fim || e.data);
    const iconeEv = t => t === 'Sessão' ? 'droplet' : t === 'Remédio' ? 'pill' : 'cal';
    const emDias = n => n === 0 ? 'hoje' : n === 1 ? 'amanhã' : `em ${n} dias`;

    function lembretes() {
      const out = [];
      eventos.forEach(e => {
        if (e.feito) return;
        const ate = diasAte(e.data);
        if (ate < 0) return;
        if ((e.tipo !== 'Remédio' && ate <= 3) || (e.tipo === 'Remédio' && ate <= 1)) out.push({ev: e, tipo: 'prox', ate});
        if (e.antec > 0 && !e.autFeita) {
          const ateP = diasAte(somaDias(e.data, -e.antec));
          if (ateP <= 7) out.push({ev: e, tipo: 'aut', ate: ateP});
        }
      });
      return out.sort((a, b) => a.ate - b.ate);
    }

    function linhaLembrete(l) {
      const e = l.ev, aut = l.tipo === 'aut';
      const r = el('div', 'lrow' + (aut && l.ate < 0 ? ' late' : ''));
      const tile = el('div', 'tile'); tile.innerHTML = ic(aut ? 'alert' : iconeEv(e.tipo));
      const t = el('div', 't');
      if (aut) {
        const prazo = somaDias(e.data, -e.antec);
        const quando = l.ate < 0 ? `prazo passou em ${fmtData(prazo)}` : l.ate === 0 ? 'prazo é hoje' : `pedir até ${fmtData(prazo)} (${emDias(l.ate)})`;
        t.append(el('b', '', 'Pedir autorização'), el('span', '', `${e.titulo} · ${fmtData(e.data)} · ${quando}`));
        const b = el('button', 'ja', 'Já pedi'); b.onclick = () => marcarEv(e, 'aut', true);
        r.append(tile, t, b);
      } else {
        const extra = e.tipo === 'Remédio' && e.fim ? ` · até ${fmtData(e.fim)}` : '';
        t.append(el('b', '', e.titulo), el('span', '', emDias(l.ate) + (e.hora ? ' às ' + e.hora : '') + extra));
        r.append(tile, t);
      }
      return r;
    }

    function atualizarLembretes() {
      const lista = lembretes();
      ['#lembretes', '#agLemb'].forEach(sel => {
        const box = $(sel); if (!box) return; box.innerHTML = '';
        if (!lista.length) return;
        const c = el('div', 'lemb'); lista.slice(0, 5).forEach(l => c.append(linhaLembrete(l))); box.append(c);
      });
    }

    async function carregarAgenda(forcar) {
      if (!eventos.length) {const c = lerCache('agenda'); if (c) eventos = c;}
      let pintou = false;
      if (eventos.length || fresco('agenda')) {desenharAgenda(); pintou = true;}
      else $('#msg').textContent = 'Carregando…';
      if (!forcar && fresco('agenda')) return;
      try {
        const r = await api('agenda');
        if (!r.ok) {$('#msg').textContent = r.erro; return;}
        $('#msg').textContent = '';
        const mudou = JSON.stringify(r.eventos) !== JSON.stringify(eventos);
        eventos = r.eventos; ultima.agenda = Date.now(); gravarCache('agenda', r.eventos);
        if (mudou || !pintou) desenharAgenda();
        atualizarLembretes();
      } catch (e) {
        $('#msg').textContent = 'Não foi possível carregar a agenda. Verifique a conexão e a implantação do Apps Script.';
      }
    }

    const COR = {'Sessão': '#c25577', 'Outro': '#6fae9e', aut: '#d9a441'};
    const clsTipo = t => t === 'Sessão' ? 'ses' : t === 'Remédio' ? 'rem' : 'out';

    function desenharAgenda() {
      const box = $('#vAgenda'); box.innerHTML = '';
      const lemb = el('div'); lemb.id = 'agLemb'; box.append(lemb);
      const card = el('div', 'calcard');
      const cab = el('div', 'cal-cab');
      const ant = el('button'); ant.setAttribute('aria-label', 'Mês anterior'); ant.innerHTML = ic('left');
      const prox = el('button'); prox.setAttribute('aria-label', 'Próximo mês'); prox.innerHTML = ic('right');
      ant.onclick = () => {mesRef = new Date(mesRef.getFullYear(), mesRef.getMonth() - 1, 1); desenharAgenda();};
      prox.onclick = () => {mesRef = new Date(mesRef.getFullYear(), mesRef.getMonth() + 1, 1); desenharAgenda();};
      cab.append(ant, el('b', '', mesRef.toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'})), prox);
      const sem = el('div', 'cal-sem'); 'DSTQQSS'.split('').forEach(x => sem.append(el('span', '', x)));
      const grade = el('div', 'cal-grade');
      for (let i = 0; i < mesRef.getDay(); i++) grade.append(el('span'));
      const total = new Date(mesRef.getFullYear(), mesRef.getMonth() + 1, 0).getDate(), hoje = isoDe(new Date());
      const temRem = x => eventos.some(e => e.tipo === 'Remédio' && cobre(e, x));
      for (let d = 1; d <= total; d++) {
        const dt = new Date(mesRef.getFullYear(), mesRef.getMonth(), d), x = isoDe(dt), dow = dt.getDay();
        // cores do dia: remédio vira faixa; sessão, outro e prazo de autorização viram o círculo
        const tipos = [];
        if (eventos.some(e => e.tipo === 'Sessão' && cobre(e, x))) tipos.push('Sessão');
        if (eventos.some(e => e.tipo === 'Outro' && cobre(e, x))) tipos.push('Outro');
        if (eventos.some(e => e.antec > 0 && !e.autFeita && !e.feito && somaDias(e.data, -e.antec) === x)) tipos.push('aut');
        let cls = 'dia' + (x === hoje ? ' hoje' : '') + (x === diaSel ? ' sel' : '');
        if (temRem(x)) {
          cls += ' rem';
          if (!(dow > 0 && temRem(somaDias(x, -1)))) cls += ' rini';
          if (!(dow < 6 && temRem(somaDias(x, 1)))) cls += ' rfim';
        }
        const b = el('button', cls); b.dataset.d = x;
        const n = el('span', 'n' + (tipos.length === 1 ? ' um' : tipos.length > 1 ? ' multi' : ''));
        n.append(el('span', '', String(d)));
        if (tipos.length === 1) n.style.setProperty('--c', COR[tipos[0]]);
        if (tipos.length > 1) {
          const p = 100 / tipos.length;
          n.style.setProperty('--g', 'conic-gradient(' + tipos.map((t, i) => `${COR[t]} ${i * p}% ${(i + 1) * p}%`).join(',') + ')');
        }
        b.append(n);
        b.onclick = () => {
          diaSel = diaSel === x ? '' : x;
          box.querySelectorAll('.dia').forEach(y => y.classList.toggle('sel', y.dataset.d === diaSel));
          desenharPainelDia();
        };
        grade.append(b);
      }
      card.append(cab, sem, grade); box.append(card);
      const dia = el('div'); dia.id = 'agDia'; const pro = el('div'); pro.id = 'agProx'; box.append(dia, pro);
      desenharPainelDia(); desenharProximos(); atualizarLembretes();
    }

    function proximosEv() {
      const hoje = isoDe(new Date());
      return eventos.filter(e => (e.fim || e.data) >= hoje && !e.feito)
        .map(e => ({e, ini: e.data < hoje ? hoje : e.data}))
        .sort((a, b) => a.ini < b.ini ? -1 : a.ini > b.ini ? 1 : (a.e.hora || '').localeCompare(b.e.hora || ''))
        .slice(0, 5);
    }

    function cartaoProx(p, i) {
      const e = p.e, hoje = isoDe(new Date()), d = doIso(p.ini);
      const r = el('div', 'item prox'); r.style.setProperty('--d', i * 40 + 'ms');
      const dt = el('div', 'pdata ' + clsTipo(e.tipo));
      dt.append(el('b', '', String(d.getDate())), el('span', '', d.toLocaleDateString('pt-BR', {month: 'short'}).replace('.', '')));
      const t = el('div', 't'); t.append(el('b', '', e.titulo));
      const q = [e.data < hoje ? 'em andamento' : emDias(diasAte(p.ini))];
      if (e.hora) q.push(e.hora);
      if (e.tipo === 'Remédio') q.push(e.fim ? `${fmtData(e.data)} a ${fmtData(e.fim)}` : fmtData(e.data)); else if (e.med) q.push(e.med);
      if (e.antec > 0) q.push(e.autFeita ? 'autorização pedida' : `autorização: ${e.antec} d antes`);
      t.append(el('span', '', q.join(' · ')));
      if (e.obs) {const o = el('span', 'obs'); o.innerHTML = ic('info'); o.append(document.createTextNode(e.obs)); t.append(o);}
      r.append(dt, t); r.onclick = () => abrirEditorEv(e); return r;
    }

    function desenharProximos() {
      const box = $('#agProx'); if (!box) return; box.innerHTML = '';
      const h = el('div', 'per'); h.innerHTML = ic('cal'); h.append(document.createTextNode('Próximos compromissos')); box.append(h);
      const lista = proximosEv();
      lista.forEach((p, i) => box.append(cartaoProx(p, i)));

      add.onclick = () => abrirEditorEv(null, diaSel || isoDe(new Date())); box.append(add);

    function cartaoEv(e, i) {
      const r = el('div', 'item evc' + (e.feito ? ' done' : '')); r.style.setProperty('--d', Math.min(i, 8) * 40 + 'ms');
      const tile = el('div', 'tile ' + clsTipo(e.tipo)); tile.innerHTML = ic(iconeEv(e.tipo));
      const t = el('div', 't'); t.append(el('b', '', e.titulo));

      if (e.antec > 0) p.push(e.autFeita ? 'autorização pedida' : `autorização: ${e.antec} d antes`);
      if (e.obs) p.push(e.obs);

    function desenharPainelDia() {
      const box = $('#agDia'); if (!box) return; box.innerHTML = '';
      if (!diaSel) return;
      const h = el('div', 'per'); h.innerHTML = ic('cal');

    async function marcarEv(e, campo, valor) {

        const r = await api('ev_salvar', {linha: editE ? editE.linha : 0, id: editE ? editE.id : '', ev});
        if (!r.ok) {$('#eMsg').textContent = r.erro; return;}
        esconderSheet($('#sheetE')); await depoisDeMudarAgenda(data); $('#msg').textContent = 'Agenda atualizada.';
      } catch (x) {$('#eMsg').textContent = 'Não foi possível salvar. Verifique a conexão.';}
      finally {b.disabled = false;}
    }
    async function excluirEv() {
      if (!editE || !confirm('Excluir este compromisso da agenda?')) return;
      try {
        const r = await api('ev_del', {linha: editE.linha, id: editE.id});
        if (!r.ok) {$('#eMsg').textContent = r.erro; return;}
        esconderSheet($('#sheetE')); await depoisDeMudarAgenda(); $('#msg').textContent = 'Compromisso excluído.';
      } catch (x) {$('#eMsg').textContent = 'Não foi possível excluir. Verifique a conexão.';}
    }
    document.querySelectorAll('#eTipo button').forEach(b => b.onclick = () => {tipoE = b.dataset.v; marcarTipoE();});
    $('#eEscolher').onchange = e => preencherE(eventos.find(x => String(x.linha) === e.target.value));
    $('#eSalvar').onclick = salvarEv; $('#eExcluir').onclick = excluirEv;
    $('#eFechar').onclick = () => esconderSheet($('#sheetE')); $('#eBg').onclick = () => esconderSheet($('#sheetE'));
    document.addEventListener('keydown', e => {if (e.key === 'Escape' && !$('#sheetE').hidden) esconderSheet($('#sheetE'));});

    $('#entrar').onclick = async () => {
      pin = $('#pin').value.trim(); if (!pin) return;
      $('#loginMsg').textContent = 'Verificando…';
      if (await carregarHoje()) localStorage.setItem('pin', pin);
    };
    $('#pin').onkeydown = e => {if (e.key === 'Enter') $('#entrar').click();};
    $('#tHoje').onclick = () => aba('hoje');
    $('#tMeds').onclick = () => aba('meds');
    $('#tPress').onclick = () => aba('press');
    $('#tItens').onclick = () => aba('itens');
    $('#tAgenda').onclick = () => aba('agenda');
    $('#atualizar').onclick = e => {
      const b = e.currentTarget; b.classList.add('spin'); setTimeout(() => b.classList.remove('spin'), 750);
      recarregar();
    };
    $('#sair').onclick = () => {
      localStorage.removeItem('pin'); pin = ''; limparCache();
      doses = []; listaMeds = []; itens = []; itensP = []; eventos = []; jaDesenhado = false; prefetchFeito = false;
      Object.keys(ultima).forEach(k => delete ultima[k]); mostrarLogin();
    };
    const menu = $('.menu');
    $('#menuBtn').onclick = e => {
      e.stopPropagation();
      const aberto = menu.classList.toggle('open');
      e.currentTarget.setAttribute('aria-expanded', aberto);
    };
    document.addEventListener('click', () => menu.classList.remove('open'));
    document.addEventListener('keydown', e => {if (e.key === 'Escape') menu.classList.remove('open');});
    document.addEventListener('visibilitychange', () => {if (!document.hidden && pin) carregarHoje();});

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });

    if (API_URL.includes('COLE_AQUI')) {
      mostrarLogin('Falta colar a URL do Apps Script no index.html (linha API_URL).');
    } else if (pin) {
      $('#app').hidden = false;
      const c = lerCache('doses');
      if (c && c.dia === hojeChave()) {doses = c.doses; cabecalhoHoje(); desenharDoses(true); jaDesenhado = true;}
      const ca = lerCache('agenda'); if (ca) {eventos = ca; atualizarLembretes();}
      else $('#msg').textContent = 'Carregando…';
      carregarHoje();
    } else {
      mostrarLogin();
    }
  </script>
</body>

</html>
